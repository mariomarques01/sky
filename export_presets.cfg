[preset.0]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,tests/*,procedural/*"
export_path="build/android/Skybound.apk"
[preset.0.options]
package/unique_name="com.skybound.ilhasperdidas"
package/name="Skybound"
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
permissions/internet=false
screen/immersive_mode=true
[preset.1]
name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,tests/*,procedural/*"
export_path="build/ios/Skybound.zip"
[preset.1.options]
application/bundle_identifier="com.skybound.ilhasperdidas"
application/name="Skybound"

[preset.2]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,tests/*,procedural/*,build/*"
export_path="build/web/index.html"

[preset.2.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
