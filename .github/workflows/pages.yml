name: Publicar Skybound no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skybound-pages
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot e template Web
        shell: bash
        run: |
          set -euo pipefail
          tag="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v$tag"
          curl -fLsS --retry 3 "${base}_linux.x86_64.zip" -o "$RUNNER_TEMP/editor.zip"
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v${tag}_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          curl -fLsS --retry 3 "${base}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -j "$RUNNER_TEMP/templates.tpz" templates/web_nothreads_release.zip -d "$dir"
      - name: Importar, testar e exportar
        run: |
          godot --headless --editor --import
          for scene in route playthrough expansion movement; do
            test_data="$(mktemp -d)"
            XDG_DATA_HOME="$test_data" godot --headless --fixed-fps 60 "tests/$scene.tscn"
            rm -rf "$test_data"
          done
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          python3 web/package_pwa.py build/web "$GITHUB_SHA"
          test -s "build/web/releases/$GITHUB_SHA/index.wasm"
          test -s "build/web/releases/$GITHUB_SHA/index.pck"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Atualizar a branch publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages/site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/pages/site"
          # Keep one previous release reachable while installed clients update.
          current_release=$(find "$RUNNER_TEMP/pages/site/releases" -mindepth 1 -maxdepth 1 -type d -printf '%f')
          previous_release=$(sed -n 's|.*<base href="./releases/\([A-Za-z0-9_-]*\)/">.*|\1|p' index.html)
          if [ -n "$previous_release" ] && [ "$previous_release" != "$current_release" ] && [ -d "releases/$previous_release" ]; then
            cp -r "releases/$previous_release" "$RUNNER_TEMP/pages/site/releases/"
          fi
          git rm -r --ignore-unmatch -- 'index.*' releases icons manifest.webmanifest service-worker.js
          cp -a "$RUNNER_TEMP/pages/site/." .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publicar Skybound de ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
